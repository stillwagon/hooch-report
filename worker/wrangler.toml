# Hooch Report backend. Free Cloudflare Workers plan is enough.
# Setup (one time):
#   cd worker && npm install
#   npx wrangler login
#   npx wrangler kv namespace create HOOCH     # paste the id below
#   npx wrangler deploy
# Then set the repo variable WORKER_URL to the deployed URL (see HoochReportGuide.md).
name = "hooch-report"
main = "src/index.js"
compatibility_date = "2026-10-01"

[[kv_namespaces]]
binding = "HOOCH"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[triggers]
crons = ["*/15 * * * *"]
