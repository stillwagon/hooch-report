name: Calibrate travel times

# Measures Buford pulse lags at Norcross, Powers Ferry and Atlanta from USGS history
# and pushes the result to the `calibrate-travel` branch for review as a pull request.
on:
  workflow_dispatch:
    inputs:
      days:
        description: Days of history to analyze
        default: "120"

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/calibrate-travel.mjs "${{ inputs.days }}"
      - run: npm test
      - name: Push result branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B calibrate-travel
          git add src/data/travel.js
          git commit -m "Calibrate pulse travel times from USGS history" || exit 0
          git push -f origin calibrate-travel
